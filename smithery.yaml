# Smithery configuration: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    required: [token, user]
    properties:
      token:
        type: string
        description: Pushover application API token
      user:
        type: string
        description: Pushover user or group key
      defaultDevice:
        type: string
        description: Device to target when a notification does not name one
      defaultSound:
        type: string
        description: Sound to use when a notification does not name one
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["dist/cli.js"],
      env: {
        PUSHOVER_TOKEN: config.token,
        PUSHOVER_USER: config.user,
        PUSHOVER_DEFAULT_DEVICE: config.defaultDevice ?? "",
        PUSHOVER_DEFAULT_SOUND: config.defaultSound ?? "",
      },
    })
  exampleConfig:
    token: YOUR_APP_TOKEN
    user: YOUR_USER_KEY
